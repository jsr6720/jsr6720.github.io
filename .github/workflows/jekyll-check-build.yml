name: Jekyll Check Build

on:
  # Run on pull requests
  pull_request:
    branches: ["main"]
  # Run on pushes to any branch
  push:
  # Allow manual triggers
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-24.04 # TODO unpin: setup-ruby has no 3.3.1 build for ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # caches installed gems automatically
      
      - name: Check Ruby version
        run: ruby --version
      
      - name: Install Dependencies
        run: bundle install
      
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace # added --trace for verbose output if build fails
        env:
          JEKYLL_ENV: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright
        working-directory: tests
        run: npm ci && npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        working-directory: tests
        run: npx playwright test
        env:
          SITE_DIR: ../_site

      - name: SEO tests on the GitHub Pages backup build
        run: |
          bundle exec jekyll build --config _config.yml,_config.gh-pages.yml -d _site-gh
          cd tests && npx playwright test -g "assembled"
        env:
          JEKYLL_ENV: production
          SITE_DIR: ../_site-gh