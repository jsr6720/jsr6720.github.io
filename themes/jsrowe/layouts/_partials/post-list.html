{{- range . }}
<div class="post-item">
  <div class="post-flex-container">
    <div class="post-left">
      <div class="post-title">
        <a class="post-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
      </div>
      <div class="post-tags">
        {{- range .Params.tags }}
        <span class="post-tag">{{ . }}</span>
        {{- end }}
      </div>
    </div>
    <div class="post-date">
      <span class="post-meta">{{ .Date.Format "Jan 2, 2006" }}</span>
    </div>
  </div>
</div>
{{- end }}
