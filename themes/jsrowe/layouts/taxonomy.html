{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>
  <div class="post-content">
    <p>
    {{- range .Data.Terms.Alphabetical }}
      <a class="tag-pill" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="tag-count">({{ .Count }})</span></a>
    {{- end }}
    </p>
  </div>
</article>
{{ end }}
